narasi:
  latar_belakang:
    - "Workshop Riset Informatika (WRI) adalah komunitas mahasiswa yang bergerak di bidang riset, rekayasa perangkat lunak, dan kecerdasan buatan di Politeknik Negeri Malang."
    - "Dalam rangka membekali mahasiswa baru dengan pemahaman awal terkait alur kerja teknologi modern dan sistem otomasi open source, kegiatan Early Access ini diselenggarakan sebagai jembatan pembelajaran intensif."
  landasan_kegiatan: "AD/ART Workshop dan Riset Informatika Politeknik Negeri Malang periode 2026/2027."
  tujuan:
    - "Memperkenalkan kultur riset dan komunitas Workshop dan Riset Informatika."
    - "Meningkatkan kemampuan pemecahan masalah dan rekayasa perangkat lunak peserta."
    - "Memberikan wadah jejaring, kolaborasi, dan eksplorasi teknologi terapan."
  sasaran:
    - "Seluruh Mahasiswa Jurusan Teknologi Informasi Politeknik Negeri Malang."
  penutup:
    paragraf_1: "Demikian proposal Workshop Riset Informatika – Early Access ini kami susun dengan sesungguh-sungguhnya, guna terlaksananya program kerja Workshop dan Riset Informatika Politeknik Negeri Malang periode 2026/2027."
    paragraf_2: "Untuk merealisasikannya, kami sangat berharap kerja sama dan bantuan semua pihak yang terkait baik secara moral maupun spiritual demi kesuksesan penyelenggaraan kegiatan ini."

